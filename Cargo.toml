[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# name = "fire cracker"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
core  = { path = "crates/core" }
rander = { path = "crates/rander" }

[profile.release]
panic = "abort"
lto = true
strip = true

[workspace.lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
